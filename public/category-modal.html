<!-- Modal for adding a new category -->
<dialog id="category-modal" class="border-0 rounded-app p-8 w-[min(440px,92vw)] shadow-[0_8px_32px_rgba(0,0,0,.18)] fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 m-0 backdrop:bg-black/40">
  <form id="category-modal-form" method="dialog">
    <h2 class="mb-5 text-xl font-semibold">Add Category</h2>
    
    <label class="flex flex-col gap-1.5 text-[0.85rem] font-semibold text-app-text-muted mb-4">
      Emoji
      <button type="button" id="category-emoji-picker" class="px-4 py-3 text-3xl border border-gray-300 rounded-xl hover:bg-gray-50 transition-colors text-left w-20">📝</button>
      <input type="hidden" id="input-category-emoji" name="emoji" value="📝">
    </label>
    
    <label class="flex flex-col gap-1.5 text-[0.85rem] font-semibold text-app-text-muted mb-4">
      English Name
      <input type="text" id="input-category-en" name="english" class="px-4 py-3 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" required>
    </label>
    
    <label class="flex flex-col gap-1.5 text-[0.85rem] font-semibold text-app-text-muted mb-4">
      Spanish Name
      <input type="text" id="input-category-es" name="spanish" class="px-4 py-3 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" required>
    </label>
    
    <div class="flex justify-end gap-3 mt-6">
      <button type="button" id="category-modal-cancel" class="px-5 py-2.5 text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 border border-gray-300 rounded-xl transition-all shadow-sm">Cancel</button>
      <button type="submit" class="px-5 py-2.5 text-sm font-medium text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 rounded-xl transition-all shadow-md hover:shadow-lg">Add Category</button>
    </div>
  </form>
</dialog>
