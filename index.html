<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn Spanish</title>
    <script type="module" crossorigin src="/assets/index-D2FWYge0.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Cr7Mq9U7.css">
  </head>
  <body>
    <div id="app" class="max-w-[680px] mx-auto px-4 py-6 pb-16">
      <header class="flex items-center justify-between mb-8">
        <h1 class="text-2xl font-bold">Learn Spanish</h1>
        <div class="flex gap-2">
          <input type="file" id="file-input" accept=".txt" class="hidden" />
          <button id="btn-import" class="px-4 py-2 bg-white border-2 border-app-primary text-app-primary rounded-app text-sm font-medium hover:bg-app-primary/5 transition-colors cursor-pointer">
            📂 Import .txt
          </button>
          <button id="btn-add" class="px-4 py-2 bg-app-primary text-white rounded-app text-sm font-medium hover:bg-app-primary-hover transition-colors border border-app-primary cursor-pointer">
            + Add Card
          </button>
        </div>
      </header>

      <div id="filter-bar" class="mb-6">
        <label class="flex items-center gap-2 text-sm text-app-text-muted">
          <span class="font-semibold">Filter by tag:</span>
          <select id="tag-filter" class="border border-app-border rounded-md px-3 py-2 text-sm bg-white text-app-text cursor-pointer min-w-[150px] focus:outline-none focus:ring-2 focus:ring-app-primary">
            <option value="">All cards</option>
          </select>
        </label>
      </div>

      <main id="card-list" class="flex flex-col gap-4">
        <!-- Cards rendered here by JS -->
      </main>

      <dialog id="modal" class="border-0 rounded-app p-8 w-[min(440px,92vw)] shadow-[0_8px_32px_rgba(0,0,0,.18)] fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 m-0 backdrop:bg-black/40">
        <form id="card-form" method="dialog">
          <h2 id="modal-title" class="mb-5 text-xl font-semibold">New Card</h2>
          
          <label class="flex flex-col gap-1.5 text-[0.85rem] font-semibold text-app-text-muted mb-4">
            English
            <div class="input-wrapper relative w-full">
              <textarea id="input-english" rows="2" placeholder="The cat is on the table." required class="input-field resize-y"></textarea>
              <button type="button" class="input-clear-btn hidden absolute top-2.5 right-2.5 w-8 h-8 rounded-full border-2 border-app-text-muted items-center justify-center text-app-text text-xl bg-transparent hover:bg-black/5 hover:border-app-text transition-all cursor-pointer" data-clear="input-english">&times;</button>
              <span class="supporting-text block text-xs text-app-text-muted mt-1.5 leading-snug">Enter the English phrase or sentence</span>
            </div>
          </label>
          
          <label class="flex flex-col gap-1.5 text-[0.85rem] font-semibold text-app-text-muted mb-4">
            Spanish
            <div class="input-wrapper relative w-full">
              <textarea id="input-spanish" rows="2" placeholder="El gato está sobre la mesa." class="input-field resize-y"></textarea>
              <button type="button" class="input-clear-btn hidden absolute top-2.5 right-2.5 w-8 h-8 rounded-full border-2 border-app-text-muted items-center justify-center text-app-text text-xl bg-transparent hover:bg-black/5 hover:border-app-text transition-all cursor-pointer" data-clear="input-spanish">&times;</button>
              <span class="supporting-text block text-xs text-app-text-muted mt-1.5 leading-snug">Enter the Spanish translation (optional)</span>
            </div>
          </label>
          
          <label class="flex flex-col gap-1.5 text-[0.85rem] font-semibold text-app-text-muted mb-4">
            Tags
            <div class="tag-input-container flex gap-2 items-start">
              <div class="input-wrapper relative flex-1">
                <input type="text" id="input-tag" placeholder="e.g., home, morning" class="input-field" />
                <button type="button" class="input-clear-btn hidden absolute top-2.5 right-2.5 w-8 h-8 rounded-full border-2 border-app-text-muted items-center justify-center text-app-text text-xl bg-transparent hover:bg-black/5 hover:border-app-text transition-all cursor-pointer" data-clear="input-tag">&times;</button>
                <span class="supporting-text block text-xs text-app-text-muted mt-1.5 leading-snug">Add tags to categorize your cards</span>
              </div>
              <button type="button" id="btn-add-tag" class="px-2.5 py-1.5 text-xs border border-app-border bg-white rounded-app font-medium hover:bg-app-bg transition-colors cursor-pointer">
                + Add
              </button>
            </div>
            <div id="tag-chips" class="flex gap-1.5 flex-wrap mt-2 min-h-[28px]"></div>
          </label>

          <label class="flex flex-col gap-1.5 text-[0.85rem] font-semibold text-app-text-muted mb-4">
            Audio Recording
            <div class="audio-controls flex gap-2 flex-wrap items-center">
              <button type="button" id="btn-record" class="px-4 py-2 border-2 border-red-600 text-red-600 bg-white rounded-app text-sm font-medium hover:bg-red-50 transition-colors cursor-pointer">
                🎤 Record
              </button>
              <button type="button" id="btn-stop-record" class="px-4 py-2 border border-app-border bg-white rounded-app text-sm font-medium hover:bg-app-bg transition-colors cursor-pointer" style="display:none;">
                ⏹ Stop
              </button>
              <button type="button" id="btn-play-preview" class="px-4 py-2 border border-app-border bg-white rounded-app text-sm font-medium hover:bg-app-bg transition-colors cursor-pointer" style="display:none;">
                ▶️ Preview
              </button>
              <button type="button" id="btn-delete-audio" class="px-4 py-2 border border-app-border bg-white rounded-app text-sm font-medium hover:bg-app-bg transition-colors cursor-pointer" style="display:none;">
                🗑 Delete
              </button>
              <span id="recording-status" class="text-[0.85rem] text-app-text-muted italic"></span>
            </div>
          </label>

          <div class="modal-actions flex justify-end gap-2.5 mt-2">
            <button type="button" id="btn-cancel" class="px-4 py-2 border border-app-border bg-white rounded-app text-sm font-medium hover:bg-app-bg transition-colors cursor-pointer">
              Cancel
            </button>
            <button type="submit" class="px-4 py-2 bg-app-primary text-white rounded-app text-sm font-medium hover:bg-app-primary-hover transition-colors border border-app-primary cursor-pointer">
              Save
            </button>
          </div>
        </form>
      </dialog>
    </div>

  </body>
</html>
