<!-- Modal for adding a new category -->
<dialog id="category-modal" class="border-0 rounded-app p-8 w-[min(560px,92vw)] shadow-[0_8px_32px_rgba(0,0,0,.18)] fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 m-0 backdrop:bg-black/40">
  <form id="category-modal-form" method="dialog">
    <div class="flex items-center justify-between mb-5">
      <h2 class="text-xl font-semibold">Add Category</h2>
      <button type="button" id="category-modal-close" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
    
    <div class="flex items-center gap-3 mb-4">
      <div id="selected-emoji-preview" class="w-12 h-12 flex items-center justify-center text-2xl overflow-hidden hidden"></div>
      <button type="button" id="category-emoji-search-btn" class="px-4 py-2.5 text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 border border-gray-300 rounded-xl transition-all">
        Choose Icon
      </button>
      <input type="hidden" id="input-category-hexcode" name="hexcode" value="">
    </div>
    
    <label class="flex flex-col gap-1.5 text-[0.85rem] font-semibold text-app-text-muted mb-4">
      English Name
      <input type="text" id="input-category-en" name="english" class="px-4 py-3 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" required>
    </label>
    
    <label class="flex flex-col gap-1.5 text-[0.85rem] font-semibold text-app-text-muted mb-4">
      Spanish Name
      <input type="text" id="input-category-es" name="spanish" class="px-4 py-3 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" required>
    </label>
    
    <div class="flex items-center justify-between gap-3 mt-6">
      <button type="button" id="category-modal-delete" class="hidden px-5 py-3 text-sm font-semibold text-red-600 bg-white hover:bg-red-50 border border-red-200 rounded-xl transition-all shadow-sm">Delete</button>
      <button type="submit" class="px-5 py-3 text-sm font-semibold text-white bg-violet-600 hover:bg-violet-700 rounded-xl transition-all shadow-md hover:shadow-lg ml-auto">Add Category</button>
    </div>
  </form>
</dialog>

<!-- Emoji Search Modal -->
<dialog id="emoji-search-modal" class="border-0 rounded-app p-6 w-[min(600px,92vw)] h-[70vh] shadow-[0_8px_32px_rgba(0,0,0,.18)] fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 m-0 backdrop:bg-black/40">
  <div class="flex flex-col h-full">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-lg font-semibold">Choose an Icon</h3>
      <button type="button" id="emoji-search-close" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
    
    <input 
      type="text" 
      id="emoji-search-input" 
      placeholder="Search icons (e.g., 'coffee', 'book', 'travel')" 
      class="px-4 py-3 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all mb-4"
      autocomplete="off"
    />
    
    <div id="emoji-search-status" class="text-sm text-gray-500 mb-2"></div>
    
    <div id="emoji-search-results" class="flex-1 overflow-y-auto grid grid-cols-5 gap-2 p-2 border border-gray-200 rounded-xl bg-gray-50">
      <div class="col-span-5 text-center text-gray-500 py-8">Loading icons...</div>
    </div>
  </div>
</dialog>
